<!DOCTYPE html>
<html>
  <head>
    <title>$if(title)$$title$ – $endif$$site-name$ – $site-description$</title>

    $partial("templates/meta.html")$

    <!--[if lt IE 9]>
      <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <link rel="stylesheet" type="text/css" href="/style.css" />
    <link rel="shortcut icon" href="/favicon.ico">
    <!-- Design based on Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="/" class="site-avatar"><img src="$site-avatar$" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="/">$site-name$</a></h1>
            <p class="site-description">$site-description$</p>
          </div>

          <nav>
            <a href="/">Blog</a>
            <!-- <a href="/projects">Projects</a> -->
            <a href="/about">About</a>
            <!-- Deliberately unlinked: /resume/ stays live but out of the nav. -->
            <!-- <a href="/resume/">Resume</a> -->
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      $body$
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          $partial("templates/svg-icons.html")$
        </footer>
      </div>
    </div>

    $partial("templates/analytics.html")$
  </body>
</html>
