---
layout: default
---

<article class="post">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;">
    <h1 style="margin:0;">{{ page.title }}</h1>
    <span class="floating-back-inline">{% include floating-back.html %}</span>
  </div>

  <div class="entry">
    {{ content }}
  </div>
  
  <div class="date">
    Written {{ page.date | date: "%B %e, %Y" }}
  </div>

  <div class="desktop-back-btn-container">
    <a href="javascript:window.history.back()" title="Go back" class="desktop-back-btn back-btn-shared">&lt;&gt;</a>
  </div>
  </div>

</article>


{% include disqus.html %}
</article>
